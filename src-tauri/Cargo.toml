[package]
name = "t-minus"
version = "0.1.4"
description = "T-Minus"
authors = ["FurySpace21"]
edition = "2021"

[[bin]]
name = "T-Minus"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
trash = "5"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
